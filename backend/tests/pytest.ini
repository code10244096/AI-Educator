# 已弃用：请从 backend/ 目录运行 `py -m pytest`，配置以 backend/pytest.ini 为准。
# 保留本文件仅为兼容偶尔在 tests/ 下直接调用的旧脚本；关键 asyncio 设置必须与上级一致。
[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = .
python_files = test_*.py
addopts = -ra
markers =
    slow: spawns subprocesses (restart / migration checks)
filterwarnings =
    ignore::DeprecationWarning
