version: '3.8'

services:
  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-teaching-backend
    restart: always
    environment:
      - ENV=production
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    networks:
      - app-network
    expose:
      - "8000"

  # 前端服务（包含 Nginx）
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api
    container_name: ai-teaching-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
