# AI 教学助手 生产部署（2 核 2GB 云服务器）
# 使用前：cp .env.example .env 并填写 JWT_SECRET、LLM_API_KEY 等（见 DEPLOY_2GB.md）
# 一条命令启动：docker compose up -d --build
# 对公网只暴露 80/443；后端 8000 只在容器网络内可见

services:
  # 后端（FastAPI）
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-teaching-backend
    restart: always
    env_file: .env
    environment:
      # 生产环境强制：禁止模拟模式、关闭接口文档、不播种演示数据
      - APP_ENV=production
      - SEED_DEMO_DATA=false
      - DATABASE_URL=sqlite+aiosqlite:////app/data/teaching_assistant.db
      - UPLOAD_DIR=/app/uploads
      - API_OUTPUT_ROOT=/app/logs/api_runs
    expose:
      - "8000"
    volumes:
      # 数据库、学生作业照片、日志都放在宿主机目录，重建容器不丢；备份脚本见 scripts/backup.sh
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 1g
    networks:
      - app-network

  # 前端（Nginx：静态页面 + /api 反向代理）
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api
    container_name: ai-teaching-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # HTTPS 证书目录。站点配置由 scripts/deploy.sh 按需附加 docker-compose.https.yml
      - ./nginx/ssl:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 256m
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
