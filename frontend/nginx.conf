# AI 教学助手 前端 + 接口反向代理（HTTP）
# 正式给老师使用前必须启用 HTTPS：见 nginx-https.conf.example 与 DEPLOY_2GB.md「启用 HTTPS」
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 手机拍照 2~8MB、一次上传多张：放宽请求体上限（后端单文件仍限制 10MB）
    client_max_body_size 100m;

    # 安全响应头（注意：location 里若有 add_header 会屏蔽这里的，需要在该 location 重复）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip 压缩
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 带 hash 的静态资源长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # API 代理（批改上传、教案生成可能较慢，超时放宽到 300 秒）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 健康检查（运维用）。/healthz 只给本机探活，不跳转 HTTPS
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # 前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }
}
